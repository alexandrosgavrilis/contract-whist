name: Deploy to GitHub Pages

# The app lives in site/. Everything else in this repo (Dockerfile,
# compose file, launcher scripts) is for running it locally and is not
# published. Deploying from a branch would only allow the repo root or
# /docs, so this workflow publishes the subfolder instead.

on:
  push:
    branches: ["main"]
  workflow_dispatch:        # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
